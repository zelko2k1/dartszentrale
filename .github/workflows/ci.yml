# CI — runs on every push and pull request: lint, tests, production build, browser checks.
# Keeps the green checkmark honest: if this fails, the app would not build, a scoring rule is
# broken, or a screen has become unusable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:ci = wie `npm test`, schlägt zusätzlich fehl, sobald ein Test übersprungen wurde
      # (vergessenes it.skip o. Ä.) — sonst meldet der Lauf "grün", obwohl weniger abgesichert ist.
      - name: Tests (game logic, keine übersprungenen)
        run: npm run test:ci

      - name: Build
        run: npm run build

  # ── Changelog gepflegt? ────────────────────────────────────────────────────
  # Die Abschnitte 1.0.6 bis 1.0.9 sind leer geblieben, und 1.1.0 waere fast leer erschienen:
  # der Release-Workflow stempelt „Unveroeffentlicht" auf die neue Version, und was dort nicht
  # steht, erfaehrt kein Verein. Diese Pruefung verlangt bei Aenderungen an ausgeliefertem Code
  # einen Eintrag. Ausweg fuer Umbauten ohne sichtbare Wirkung: Label `no-changelog` am PR.
  changelog:
    name: Changelog gepflegt
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eintrag verlangen, wenn ausgelieferter Code sich aendert
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base...HEAD")"
          # Nur was beim Verein ankommt: Oberflaeche, Server-Teil, Betriebsskripte.
          # Tests, CI und Doku bleiben bewusst aussen vor — sie aendern nichts am Betrieb.
          code="$(printf '%s\n' "$changed" | grep -E '^(app/src/|pocketbase/pb_hooks/|pocketbase/pb_migrations/|scripts/)' || true)"
          if [ -z "$code" ]; then
            echo "Kein ausgeliefertes Verhalten geaendert — kein Eintrag noetig."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Changelog ist gepflegt."
            exit 0
          fi
          echo "::error::Dieser PR aendert ausgelieferten Code, aber nicht CHANGELOG.md."
          printf '%s\n' "$code" | sed 's/^/  · /'
          echo "Bitte unter '## [Unveroeffentlicht]' eintragen — oder das Label 'no-changelog' setzen, wenn sich fuer den Verein nichts aendert."
          exit 1

  # ── Browser-Prüfungen (Playwright) ─────────────────────────────────────────
  # Liefen bisher NUR von Hand. Folge: die Vereinsmodus-Prüfungen — also genau der Modus, den
  # Vereine benutzen — übersprangen sich überall selbst, weil nirgends Zugangsdaten gesetzt waren.
  # Dieser Job zieht eine WEGWERF-PocketBase hoch, richtet sie wie eine echte Installation ein
  # (Superuser, App-Admin, Board-Konto, Demodaten) und lässt die Suite vollständig laufen.
  e2e:
    name: E2E im Browser (inkl. Vereinsmodus)
    runs-on: ubuntu-latest
    env:
      # Gepinnt wie in pocketbase/Dockerfile und scripts/start-club-lan.* — beim Upgrade mitziehen.
      PB_VERSION: 0.39.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app

      # Wegwerf-Zugangsdaten, im Lauf gewürfelt: sie existieren nur für die Dauer dieses Jobs,
      # deshalb braucht es kein Repo-Secret (und niemand kann vergessen, eins zu hinterlegen).
      # add-mask hält sie trotzdem aus dem Protokoll.
      - name: Zugangsdaten für die Wegwerf-Instanz erzeugen
        run: |
          set -euo pipefail
          for var in PB_SU_PASS DZ_E2E_PASS DZ_E2E_BOARD_PASS MEMBER_PW; do
            value="$(openssl rand -hex 20)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done
          {
            echo "PB_SU_EMAIL=ci-superuser@dartszentrale.invalid"
            echo "DZ_E2E_EMAIL=ci-admin@dartszentrale.invalid"
            echo "DZ_E2E_BOARD_EMAIL=ci-board1@dartszentrale.invalid"
          } >> "$GITHUB_ENV"

      - name: PocketBase laden
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pb.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o /tmp/pb.zip pocketbase -d pocketbase/
          chmod +x pocketbase/pocketbase

      # Richtet die Instanz genau so ein, wie start-club-lan.sh es beim Verein tut: Superuser per
      # CLI, App-Admin per REST, danach Inhalte. Am Ende wird die Instanz wieder gestoppt —
      # Playwright startet sie selbst (webServer in playwright.config.ts).
      - name: Wegwerf-Instanz einrichten
        working-directory: pocketbase
        run: |
          set -euo pipefail
          # Die PocketBase-CLI meldet Fehler auf STDOUT und liefert TROTZDEM Rückgabewert 0 —
          # deshalb die Ausgabe prüfen, nicht den Code.
          out="$(./pocketbase superuser upsert "$PB_SU_EMAIL" "$PB_SU_PASS" --dir pb_data 2>&1 || true)"
          case "$out" in *Error*) echo "::error::Superuser konnte nicht angelegt werden: $out"; exit 1 ;; esac

          # --migrationsDir/--hooksDir MUESSEN mit: die Vorgabewerte haengen am Datenverzeichnis,
          # nicht am Arbeitsverzeichnis. Ohne sie bleibt die frische Datenbank ohne Schema (nur
          # "users") und ohne Hooks — nachgemessen, kostet sonst eine Stunde Fehlersuche.
          ./pocketbase serve --http=127.0.0.1:8090 --dir pb_data \
            --migrationsDir pb_migrations --hooksDir pb_hooks > /tmp/pb.log 2>&1 &
          pb_pid=$!
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8090/api/health >/dev/null || { echo "::error::PocketBase kam nicht hoch"; cat /tmp/pb.log; exit 1; }

          token="$(curl -fsS -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
                     -H 'Content-Type: application/json' \
                     -d "{\"identity\":\"$PB_SU_EMAIL\",\"password\":\"$PB_SU_PASS\"}" \
                   | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")"
          [ -n "$token" ] || { echo "::error::Superuser-Anmeldung fehlgeschlagen"; exit 1; }

          curl -fsS -X POST http://127.0.0.1:8090/api/collections/users/records \
            -H "Authorization: $token" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DZ_E2E_EMAIL\",\"password\":\"$DZ_E2E_PASS\",\"passwordConfirm\":\"$DZ_E2E_PASS\",\"emailVisibility\":true,\"verified\":true,\"name\":\"CI Admin\",\"first\":\"CI\",\"last\":\"Admin\",\"role\":\"admin\",\"active\":true}" > /dev/null

          # Reihenfolge zählt: demo-seed leert alle Nicht-Admin-Konten, das Board-Konto muss also
          # DANACH entstehen, sonst räumt der Seed es gleich wieder weg.
          node demo-seed.mjs
          BOARD_EMAIL="$DZ_E2E_BOARD_EMAIL" BOARD_PW="$DZ_E2E_BOARD_PASS" BOARD_NUMBER=1 node add-board-account.mjs

          kill "$pb_pid" 2>/dev/null || true
          wait "$pb_pid" 2>/dev/null || true

      # Ohne diese Zusicherung wäre der Job auch dann grün, wenn sich die Vereins-Prüfungen wieder
      # stillschweigend überspringen — also genau in dem Zustand, den dieser Job beheben soll.
      - name: Zusichern, dass die Vereins-Prüfungen laufen
        run: |
          set -euo pipefail
          for var in DZ_E2E_EMAIL DZ_E2E_PASS DZ_E2E_BOARD_EMAIL DZ_E2E_BOARD_PASS; do
            [ -n "${!var:-}" ] || { echo "::error::$var ist leer — die Vereins-Prüfungen würden sich überspringen."; exit 1; }
          done

      - name: E2E (Build + Playwright)
        run: npm run e2e
        working-directory: app

      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/e2e/.artifacts
          retention-days: 7

  # ── Erststart unter Windows ────────────────────────────────────────────────
  # start-club-lan.ps1 geht an Endnutzer, wurde aber nie ausgefuehrt: der Handtest stand seit
  # Wochen offen, waehrend die Datei sich weiter aenderte. Dieser Job spielt den Erststart
  # tatsaechlich durch — inklusive des Abbruchpfads bei belegtem Port.
  #
  # Gestartet wird ueber `powershell` (Windows PowerShell 5.1), nicht `pwsh`: genau so ruft es
  # start-club-lan.bat auf dem Vereinsrechner auf, und 5.1 verhaelt sich bei nativen Befehlen
  # und $ErrorActionPreference anders als PowerShell 7.
  windows-erststart:
    name: Erststart unter Windows (start-club-lan.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testbuendel zusammenstellen
        shell: pwsh
        run: |
          # Wie das Bundle 02-club-lan, nur ohne gebautes Frontend: geprueft wird die
          # Einrichtung, nicht die Oberflaeche — dafuer genuegt ein Platzhalter in pb_public.
          foreach ($name in 'a', 'b') {
            $dir = Join-Path $env:RUNNER_TEMP "club-lan-$name"
            New-Item -ItemType Directory -Force -Path (Join-Path $dir 'pb_public') | Out-Null
            Copy-Item scripts/start-club-lan.ps1 $dir
            Copy-Item -Recurse -Force pocketbase/pb_migrations (Join-Path $dir 'pb_migrations')
            Copy-Item -Recurse -Force pocketbase/pb_hooks (Join-Path $dir 'pb_hooks')
            Set-Content (Join-Path $dir 'pb_public/index.html') '<html><body>DZ</body></html>'
          }
          "BUNDLE_A=$(Join-Path $env:RUNNER_TEMP 'club-lan-a')" >> $env:GITHUB_ENV
          "BUNDLE_B=$(Join-Path $env:RUNNER_TEMP 'club-lan-b')" >> $env:GITHUB_ENV

      - name: Zugangsdaten fuer den Testlauf erzeugen
        shell: pwsh
        run: |
          $su = [guid]::NewGuid().ToString('N')
          $ad = [guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$su"
          Write-Host "::add-mask::$ad"
          @(
            "PB_SU_EMAIL=ci-superuser@dartszentrale.invalid"
            "PB_SU_PASS=$su"
            "APP_ADMIN_EMAIL=ci-admin@dartszentrale.invalid"
            "APP_ADMIN_PASS=$ad"
            "PB_HOST=127.0.0.1"
            "PORT=8090"
          ) | ForEach-Object { $_ >> $env:GITHUB_ENV }

      - name: Erststart laeuft unbeaufsichtigt durch und legt beide Konten an
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:BUNDLE_A 'start-club-lan.ps1'
          $proc = Start-Process powershell -PassThru `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $script
          try {
            $healthy = $false
            for ($i = 0; $i -lt 120; $i++) {
              try { Invoke-RestMethod 'http://127.0.0.1:8090/api/health' -TimeoutSec 2 | Out-Null; $healthy = $true; break }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $healthy) { throw 'PocketBase kam nicht hoch.' }
            if (-not (Test-Path (Join-Path $env:BUNDLE_A 'pb_data'))) { throw 'pb_data fehlt.' }

            # Der eigentliche Beweis: das angelegte App-Konto kann sich wirklich anmelden.
            $body = @{ identity = $env:APP_ADMIN_EMAIL; password = $env:APP_ADMIN_PASS } | ConvertTo-Json
            $auth = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body `
              -Uri 'http://127.0.0.1:8090/api/collections/users/auth-with-password'
            if ($auth.record.role -ne 'admin') { throw "Rolle ist '$($auth.record.role)', erwartet 'admin'." }
            if (-not $auth.record.active) { throw 'Konto ist nicht aktiv (die 403-Falle).' }
            Write-Host "+ Erststart in Ordnung, App-Admin meldet sich an."

            # Zweiter Lauf gegen denselben Port: muss VOR jeder Aenderung abbrechen.
            $zweit = Start-Process powershell -PassThru -Wait `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $env:BUNDLE_B 'start-club-lan.ps1')
            if ($zweit.ExitCode -eq 0) { throw 'Belegter Port wurde nicht erkannt.' }
            if (Test-Path (Join-Path $env:BUNDLE_B 'pb_data')) { throw 'Trotz Abbruch wurde pb_data angelegt.' }
            Write-Host "+ Belegter Port bricht sauber ab, ohne etwas anzulegen."
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process pocketbase -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
